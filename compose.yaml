services:
  database:
    image: postgres:18
    env_file:
      - ./backend/.env
    container_name: postgress_db
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10


  migrate:
    build:
      context: ./backend
      target: migrate
    env_file:
      - ./backend/.env
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runner
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/v1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  pgdata:


